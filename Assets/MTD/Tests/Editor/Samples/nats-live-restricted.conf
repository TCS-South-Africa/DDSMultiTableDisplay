# A throwaway NATS server for NatsLiveTests: it lets the login in but denies it the table summary subscription,
# the way a T-Connect broker with a missing permission would. It listens on this machine's loopback address only,
# and the login below exists nowhere else.
#
#   nats-server -c Assets/MTD/Tests/Editor/Samples/nats-live-restricted.conf

host: "127.0.0.1"
port: 14223

authorization {
  users = [
    {
      user: "mtd-live-test"
      password: "mtd-live-test"
      permissions: { subscribe: { deny: ["tcsjh.table.*.mtdsummary"] } }
    }
  ]
}
